<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism — Builds</title>
<script>
  // This page lives on Cloudflare. If you're seeing the GitHub Pages copy,
  // bounce to the Cloudflare version.
  if (location.hostname.endsWith("github.io")) {
    location.replace("https://prism.foxcorpgames.workers.dev/app/");
  }
</script>
<style>
  :root{--bg:#313338;--side:#2b2d31;--darker:#1e1f22;--text:#dbdee1;--dim:#949ba4;--accent:#5865f2;--accent2:#8b5cf6;--input:#383a40;--hover:#35373c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:"gg sans","Segoe UI",system-ui,sans-serif;padding:20px}
  .box{width:min(420px,94vw);background:var(--side);border-radius:16px;padding:36px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{font-size:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-size:30px;margin:4px 0}
  .tag{color:var(--dim);font-size:13px;margin-bottom:26px}
  .builds{display:flex;flex-direction:column;gap:12px}
  .build{display:block;text-decoration:none;color:var(--text);background:var(--input);border-radius:12px;padding:18px;font-size:17px;font-weight:700}
  .build:hover{background:var(--hover)}
  .build small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:4px}
  .build.primary{background:var(--accent);color:#fff}
  .build.primary small{color:rgba(255,255,255,.75)}
  .build.primary:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">◈</div>
    <h1>Prism</h1>
    <p class="tag">Builds — free forever. No nitro. Just chat.</p>
    <div class="builds">
      <a class="build primary" href="https://prism.foxcorpgames.workers.dev/web/">🌐 Web<small>Open Prism in your browser</small></a>
      <a class="build" href="https://github.com/Ajgplayz-studio/prism/releases/download/Prism/Prism_1.0.0_x64-setup.exe">🪟 Windows<small>Download the Windows app (EXE)</small></a>
      <a class="build" href="https://median.co/share/rdayqnl#apk">🤖 Android<small>Download the Android app (APK)</small></a>
    </div>
  </div>
</body>
</html>
