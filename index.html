<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#202127; --side:#191a20; --dark:#17181e; --darker:#131419;
    --text:#e5e5e9; --dim:#a0a3ad; --accent:#5755d9; --accent2:#7875ee;
    --input:#292b32; --hover:#272930; --err:#f23f43;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:"gg sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px}
  .hidden{display:none!important}

  /* ---------- auth ---------- */
  #auth{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(800px 500px at 50% 20%, rgba(88,101,242,.18), transparent 70%), var(--darker)}
  .abox{width:min(420px,94vw);background:var(--side);border-radius:16px;padding:36px 32px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .abox .logo{font-size:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .abox h1{font-size:30px;margin:4px 0}
  .abox .tag{color:var(--dim);font-size:13px;margin-bottom:22px}
  .tabs{display:flex;background:var(--darker);border-radius:10px;padding:4px;margin-bottom:18px}
  .tabs button{flex:1;border:none;background:none;color:var(--dim);padding:10px;border-radius:8px;
    cursor:pointer;font-size:14px;font-weight:600}
  .tabs button.active{background:var(--input);color:#fff}
  .abox input{width:100%;padding:12px 14px;border-radius:8px;border:none;background:var(--input);
    color:var(--text);font-size:15px;outline:none;margin-bottom:12px}
  .abox input:focus{outline:2px solid var(--accent)}
  .abox .go{width:100%;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:700;
    font-size:15px;background:var(--accent);color:#fff;margin-top:4px}
  .abox .go:hover{background:#4752c4}
  .abox .go:disabled{opacity:.5;cursor:wait}
  .err{color:var(--err);font-size:13px;min-height:20px;margin:6px 0;text-align:left}

  /* ---------- layout ---------- */
  #app{height:100%;display:flex}
  #rail{width:72px;flex:none;background:var(--darker);display:flex;flex-direction:column;align-items:center;
    padding:12px 0;gap:10px;overflow-y:auto}
  .srv{width:48px;height:48px;border-radius:50%;background:var(--side);display:flex;align-items:center;
    justify-content:center;cursor:pointer;font-size:20px;font-weight:700;transition:border-radius .2s;
    position:relative;color:#fff;flex:none;overflow:hidden;white-space:nowrap}
  .srv:hover{border-radius:16px;background:var(--accent)}
  .srv.active{border-radius:16px;background:var(--accent)}
  .srv .pill{position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:0;
    background:#fff;border-radius:0 4px 4px 0;transition:height .2s}
  .srv.active .pill{height:32px}
  .srv.add{background:transparent;border:2px dashed #4e5058;color:#4e5058;font-size:24px;font-weight:400}
  .srv.add:hover{border-color:var(--accent);color:var(--accent);background:transparent}
  .rail-sep{width:32px;height:2px;background:#35363c;border-radius:2px;flex:none}

  #channels{width:240px;flex:none;background:var(--side);display:flex;flex-direction:column}
  #channels .srv-name{padding:16px;font-weight:700;border-bottom:1px solid var(--darker);
    display:flex;align-items:center;gap:8px}
  #channels .srv-name .free{font-size:10px;font-weight:600;background:rgba(88,101,242,.2);color:#b5bac1;
    padding:3px 8px;border-radius:8px}
  #chan-list{flex:1;overflow-y:auto;padding:12px 8px}
  #chan-list .cat{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px;padding:8px;
    display:flex;align-items:center;justify-content:space-between}
  #chan-list .cat button{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;
    padding:0 4px;border-radius:4px}
  #chan-list .cat button:hover{color:#fff;background:var(--hover)}
  .chan{padding:8px 10px;border-radius:6px;color:var(--dim);cursor:pointer;margin:1px 0;
    display:flex;align-items:center;gap:8px;font-weight:500}
  .chan:hover{background:var(--hover);color:var(--text)}
  .chan.active{background:#404249;color:#fff}
  .chan .hash{color:#80848e;font-size:18px;font-weight:400}
  .chan .dmav{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:11px;font-weight:700;color:#fff;position:relative}
  .chan .odot{position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;
    background:#80848e;border:2px solid var(--side)}
  .chan .odot.on{background:#23a55a}
  .chan .dname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chan .badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:10px;
    padding:2px 7px;flex:none}
  .chan .badge.hidden{display:none}
  .chan .dx{display:none;color:var(--dim);font-size:16px;line-height:1;padding:2px 6px;border-radius:4px;flex:none}
  .chan:hover .dx{display:block}
  .chan .dx:hover{color:#fff;background:var(--hover)}
  #userbar{padding:10px;background:#232428;display:flex;align-items:center;gap:10px}
  #avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:15px}
  #uname{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #uname small{display:block;color:var(--dim);font-weight:400;font-size:11px}
  #logout{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:6px;border-radius:6px}
  #logout:hover{background:var(--hover);color:var(--text)}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  #chead{padding:12px 16px;border-bottom:1px solid var(--darker);font-weight:700;display:flex;gap:10px;align-items:center}
  #chead .hash{color:#80848e;font-size:22px;font-weight:400}
  #chead .topic{color:var(--dim);font-weight:400;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:2px}
  .daydiv{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:11px;font-weight:700;
    margin:14px 0 6px;text-transform:uppercase}
  .daydiv::before,.daydiv::after{content:"";flex:1;height:1px;background:#3f4147}
  .msg{display:flex;gap:14px;padding:6px 8px;border-radius:6px}
  .msg:hover{background:#2e3035}
  .msg .ma{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff}
  .msg .mb{min-width:0;flex:1}
  .msg .mh{display:flex;gap:8px;align-items:baseline}
  .msg .mu{font-weight:600;color:#fff}
  .msg .mt{font-size:11px;color:var(--dim)}
  .msg .mx{color:var(--text);line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
  .msg .mx a{color:#00a8fc}
  #typing{padding:4px 18px;font-size:12px;color:var(--dim);min-height:22px;font-style:italic}
  #inputbar{padding:0 16px 20px}
  #inputwrap{background:var(--input);border-radius:10px;padding:12px 16px}
  #minput{background:none;border:none;outline:none;color:var(--text);font-size:15px;width:100%;
    font-family:inherit;resize:none;max-height:120px}
  #minput::placeholder{color:#6d6f78}

  #members{width:230px;flex:none;background:var(--side);padding:16px 12px;overflow-y:auto}
  #members h4{font-size:11px;color:var(--dim);letter-spacing:1px;margin-bottom:10px}
  .mem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;color:var(--dim)}
  .mdel{margin-left:auto;background:none;border:none;cursor:pointer;opacity:.5;font-size:13px;padding:4px}
  .mdel:hover{opacity:1}
  .mem:hover{background:var(--hover)}
  .mem .dot{width:10px;height:10px;border-radius:50%;background:#23a55a;flex:none}
  .mem .mav{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .mem .mtext{min-width:0}
  .mem .mname{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mem .mstatus{font-size:11px;color:var(--dim);opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}

  /* ---------- themes ---------- */
  [data-theme="light"]{
    --bg:#ffffff; --side:#f2f3f5; --dark:#e3e5e8; --darker:#c7cad0;
    --text:#060607; --dim:#5f636b; --input:#e3e5e8; --hover:#dbdde1; --err:#c03535;
  }
  [data-theme="light"] .tabs button.active{color:#060607}
  [data-theme="light"] #userbar{background:#e3e5e8}
  [data-theme="light"] .msg:hover{background:#f2f3f5}
  [data-theme="light"] .daydiv::before,[data-theme="light"] .daydiv::after{background:#c7cad0}
  [data-theme="light"] .chan .odot{border-color:#f2f3f5}
  [data-theme="midnight"]{
    --bg:#000000; --side:#08080a; --dark:#000000; --darker:#000000;
    --text:#dcddde; --dim:#87898c; --input:#121214; --hover:#18181c; --err:#f04747;
  }

  /* ---------- message extras ---------- */
  .msg{position:relative}
  .msg .mact{position:absolute;top:2px;right:6px;display:none;background:var(--side);border:1px solid var(--darker);
    border-radius:8px;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5}
  .msg:hover .mact{display:flex}
  .msg .mact button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;
    padding:5px 7px;border-radius:6px;line-height:1}
  .msg .mact button:hover{background:var(--hover);color:var(--text)}
  .msg .mact button.on{color:var(--accent)}
  .rxns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .rxn{background:var(--input);border:1px solid transparent;border-radius:8px;padding:2px 8px;
    font-size:13px;cursor:pointer;color:var(--text)}
  .rxn.me{border-color:var(--accent);background:rgba(88,101,242,.18)}
  .rply{font-size:12px;color:var(--dim);border-left:2px solid var(--dim);padding:2px 0 2px 8px;
    margin-bottom:4px;cursor:pointer;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .rply:hover{opacity:1}
  .rply b{color:var(--text)}
  .edited{font-size:10px;color:var(--dim);margin-left:4px}
  .msg.flash{animation:flash 1.5s}
  @keyframes flash{0%,60%{background:rgba(88,101,242,.25)}100%{background:transparent}}
  #epick{position:fixed;z-index:70;background:var(--side);border:1px solid var(--darker);border-radius:12px;
    padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;
    box-shadow:0 10px 34px rgba(0,0,0,.55);width:330px}
  #epick button{background:none;border:none;font-size:22px;cursor:pointer;padding:5px;border-radius:6px;line-height:1}
  #epick button:hover{background:var(--hover);transform:scale(1.15)}
  #replybar{display:flex;align-items:center;gap:8px;background:var(--input);border-radius:8px 8px 0 0;
    padding:8px 12px;font-size:13px;color:var(--dim);margin:0 16px}
  #replybar b{color:var(--text)}
  #replybar #reply-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  #replybar .rx{margin-left:auto;cursor:pointer;padding:2px 6px;border-radius:4px;flex:none}
  #replybar .rx:hover{background:var(--hover);color:var(--text)}
  #pinbtn{margin-left:auto;background:var(--input);border:none;color:var(--dim);cursor:pointer;
    font-size:13px;padding:5px 10px;border-radius:8px;font-weight:600}
  #pinbtn:hover{color:var(--text);background:var(--hover)}
  #chdel{margin-left:8px;background:var(--input);border:none;color:var(--dim);cursor:pointer;
    border-radius:8px;padding:6px 10px;font-size:14px}
  #chdel:hover{color:var(--err);background:var(--hover)}
  .fdel{background:none;border:none;cursor:pointer;opacity:.55;font-size:12px;padding:0 0 0 6px}
  .fdel:hover{opacity:1}
  #fdelpost{margin-top:12px;background:var(--input);border:none;color:var(--err);border-radius:8px;
    padding:8px 14px;cursor:pointer;font-size:14px}
  #fdelpost:hover{background:var(--hover)}

  /* ---------- settings + pins overlays ---------- */
  #settings,#pins{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;
    justify-content:center;z-index:60}
  #settings .box,#pins .box{background:var(--side);border-radius:14px;padding:28px;width:min(440px,92vw);
    max-height:86vh;overflow-y:auto}
  #settings h2,#pins h2{margin-bottom:14px}
  #settings label{display:block;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.5px;
    margin:14px 0 6px;text-transform:uppercase}
  #settings .trow{display:flex;gap:8px}
  #settings .trow button{flex:1;padding:10px;border:2px solid transparent;border-radius:8px;cursor:pointer;
    background:var(--input);color:var(--text);font-weight:600;font-size:13px}
  #settings .trow button.sel{border-color:var(--accent)}
  #settings input[type="text"],#settings textarea{width:100%;padding:10px 12px;border-radius:8px;border:none;
    background:var(--input);color:var(--text);font-size:14px;outline:none;font-family:inherit}
  #settings textarea{min-height:90px;resize:vertical;font-family:monospace;font-size:12px}
  #settings input[type="color"]{width:52px;height:38px;border:none;border-radius:8px;background:var(--input);
    padding:4px;cursor:pointer}
  #profile-icon-tools{display:flex;align-items:center;gap:13px;padding:12px;background:var(--input);border-radius:12px}
  #set-avatar-preview{width:66px;height:66px;flex:none;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;overflow:hidden;background:#454956}
  #profile-icon-actions{min-width:0;flex:1}
  #profile-icon-actions .trow{margin-top:8px}
  #profile-icon-actions .trow button{padding:8px;font-size:12px}
  #set-avatar-help{display:block;margin-top:7px;color:var(--dim);font-size:11px;line-height:1.4}
  #settings input[type="file"]{display:none}
  .profile-avatar-img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
  #settings .row{display:flex;gap:10px;margin-top:18px}
  #settings .row button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
  #set-save{background:var(--accent);color:#fff}
  #set-cancel{background:var(--input);color:var(--text)}
  #get-themes{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;
    font-weight:700;padding:0 0 0 10px}
  #get-themes:hover{text-decoration:underline}
  .pinitem{background:var(--input);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
  .pinitem:hover{background:var(--hover)}
  .pinitem .pinhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .pinitem .pinhead b{color:var(--text)}
  .pinitem .pinhead span{color:var(--dim)}
  .pinitem .pintext{font-size:14px;color:var(--text);word-wrap:break-word}
  .pin-empty{color:var(--dim);text-align:center;padding:20px}
  #pins .prow{display:flex;justify-content:flex-end;margin-top:6px}
  #pins .prow button{background:var(--input);border:none;color:var(--text);padding:10px 18px;border-radius:8px;
    cursor:pointer;font-weight:700}
  #set-open{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:6px;border-radius:6px}
  #set-open:hover{background:var(--hover);color:var(--text)}

  /* ---------- server menu ---------- */
  #channels .srv-name{cursor:pointer}
  #channels .srv-name:hover{background:var(--hover)}
  #srvmenu{position:fixed;z-index:70;background:var(--side);border:1px solid var(--darker);
    border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:210px}
  #srvmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px}
  #srvmenu button:hover{background:var(--hover)}
  #srvmenu button.danger{color:var(--err)}
  #srvmenu button.info{opacity:.55;cursor:default}
  #srvmenu button.info:hover{background:none}

  /* ---------- forum channels ---------- */
  #newpost{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 16px;
    font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;align-self:flex-start}
  #newpost:hover{filter:brightness(1.15)}
  .fpost{background:var(--side);border:1px solid var(--darker);border-radius:10px;padding:14px;
    margin-bottom:10px;cursor:pointer}
  .fpost:hover{border-color:var(--accent)}
  .ftitle{font-weight:700;font-size:16px;margin-bottom:4px}
  .ftitle.big{font-size:20px;margin-bottom:6px}
  .fmeta{color:var(--dim);font-size:12px;margin-bottom:8px}
  .fbody{color:var(--text);font-size:14px;white-space:pre-wrap;word-break:break-word}
  .fempty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
  #fback{background:var(--input);border:none;color:var(--text);border-radius:8px;padding:8px 14px;
    cursor:pointer;margin-bottom:12px;align-self:flex-start;font-size:14px}
  #fback:hover{background:var(--hover)}
  .fdetail{background:var(--side);border:1px solid var(--darker);border-radius:10px;padding:16px;margin-bottom:12px}
  .freply{background:var(--side);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .freplies-h{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px;margin:4px 0 8px}

  /* ---------- channel type picker ---------- */
  .typepick{flex:1;background:var(--input);border:1px solid var(--darker);color:var(--text);
    border-radius:10px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;
    gap:6px;align-items:center;font-size:14px;justify-content:center}
  .typepick:hover{border-color:var(--accent)}
  .typepick small{opacity:.6;font-size:12px}

  /* modal + toast */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50}
  #modal .box{background:var(--side);border-radius:14px;padding:28px;width:min(400px,90vw)}
  #modal h2{margin-bottom:6px}
  #modal p{color:var(--dim);font-size:13px;margin-bottom:16px}
  #modal input{width:100%;padding:12px;border-radius:8px;border:none;background:var(--input);
    color:var(--text);font-size:15px;outline:none;margin-bottom:14px}
  #modal .row{display:flex;gap:10px}
  #modal .row button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
  #m-ok{background:var(--accent);color:#fff}
  #m-cancel{background:var(--input);color:var(--text)}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111214;
    color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:99;transition:transform .25s;
    border:1px solid var(--err);max-width:90vw}
  #toast.show{transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){#members{display:none}}
  @media (max-width:640px){#channels{width:200px}#rail{width:60px}.srv{width:42px;height:42px}}

  /* ---------- Prism visual refresh: Fluxer-inspired, without changing app logic ---------- */
  html { color-scheme: dark; }
  html[data-theme="light"] { color-scheme: light; }
  body {
    font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    letter-spacing: 0;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; }
  button { transition: background-color .12s ease, color .12s ease, border-color .12s ease, opacity .12s ease; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 38%, transparent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, var(--side));
    border: 2px solid transparent; border-radius: 6px; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--dim) 48%, var(--side)); background-clip: padding-box; }

  /* Auth: understated, product-like rather than a glowing landing page */

<script>
"use strict";
/* Prism v2 — accounts, DMs, custom servers. Database: Firebase Realtime Database. */
const firebaseConfig = {
  apiKey: "AIzaSyCywBVhG8iKbmK3K5oz0NBFmIWzopFQ5N0",
  authDomain: "discord-prism.firebaseapp.com",
  databaseURL: "https://discord-prism-default-rtdb.firebaseio.com",
  projectId: "discord-prism",
  storageBucket: "discord-prism.firebasestorage.app",
  messagingSenderId: "819453764446",
  appId: "1:819453764446:web:95f06de84fa69d994165cf",
  measurementId: "G-8DB05G3V3Y"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const TS = firebase.database.ServerValue.TIMESTAMP;

const $ = id => document.getElementById(id);
const COLORS = ["#5865f2","#8b5cf6","#ec4899","#22d3ee","#4ade80","#fb923c","#f472b6","#facc15"];
const colorFor = n => COLORS[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isAdmin = () => me && me.name && me.name.toLowerCase() === "ajgplayz";
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const emailOf = name => name.toLowerCase() + "@prism.chat";
const validName = n => /^[a-zA-Z0-9_]{3,20}$/.test(n);

let toastT = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3500);
}

/* ---------------- state ---------------- */
let me = null;                 // {uid, name}
let servers = {};             // sid -> {name, owner}
let myServers = {};           // sid -> true (servers I've joined)
let view = {type:"server", sid:null, cid:null};
let liveRefs = [];            // message/typing refs to .off() on view change
let chanListRef = null;       // channel-list ref for the open server
let bootRefs = [];            // persistent boot listeners
const profileAvatarCache = Object.create(null);
const avatarReadPending = new Set();
const avatarReadDone = new Set();
let draftAvatar = "";

function isSafeAvatarSource(value){
  if(typeof value !== "string" || value.length > 260000) return false;
  if(/^https:\/\/[^\s"'<>]+$/i.test(value)) return true;
  return /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/i.test(value);
}
function renderProfileAvatar(el, source, name){
  if(!el) return;
  const dot = el.querySelector(".odot");
  el.replaceChildren();
  el.style.background = colorFor(name || "Prism");
  if(isSafeAvatarSource(source)){
    const image = document.createElement("img");
    image.className = "profile-avatar-img";
    image.alt = (name || "User") + " profile icon";
    image.src = source;
    image.draggable = false;
    image.onerror = () => renderProfileAvatar(el, "", name);
    el.appendChild(image);
  }else{
    el.textContent = (String(name || "?").trim()[0] || "?").toUpperCase();
  }
  if(dot) el.appendChild(dot);
}
function loadPublicAvatar(uid, el, name){
  if(!uid || !el) return;
  if(Object.prototype.hasOwnProperty.call(profileAvatarCache, uid)){
    renderProfileAvatar(el, profileAvatarCache[uid], name);
    return;
  }
  if(avatarReadDone.has(uid) || avatarReadPending.has(uid)) return;
  avatarReadPending.add(uid);
  db.ref("prism/users/" + uid + "/avatar").once("value").then(snap => {
    const avatar = snap.val() || "";
    profileAvatarCache[uid] = isSafeAvatarSource(avatar) ? avatar : "";
    avatarReadDone.add(uid);
    document.querySelectorAll("#dm-list .chan[data-other-uid]").forEach(row => {
      if(row.dataset.otherUid === uid){
        const avatarEl = row.querySelector(".dmav");
        if(avatarEl) renderProfileAvatar(avatarEl, profileAvatarCache[uid], row.querySelector(".dname")?.textContent || name);
      }
    });
  }).catch(() => {}).finally(() => avatarReadPending.delete(uid));
}
function unlisten(){ liveRefs.forEach(r => r.off()); liveRefs = []; }
function listen(ref, ev, cb){ ref.on(ev, cb); liveRefs.push(ref); }

/* ---------------- auth UI ---------------- */
$("tab-login").onclick = () => {
  $("tab-login").classList.add("active"); $("tab-signup").classList.remove("active");
  $("pane-login").classList.remove("hidden"); $("pane-signup").classList.add("hidden");
};
$("tab-signup").onclick = () => {
  $("tab-signup").classList.add("active"); $("tab-login").classList.remove("active");
  $("pane-signup").classList.remove("hidden"); $("pane-login").classList.add("hidden");
};
function friendlyAuth(e){
  const c = (e && e.code) || "";
  if(c === "auth/email-already-in-use") return "That username is taken.";
  if(c === "auth/wrong-password" || c === "auth/invalid-credential") return "Wrong username or password.";
  if(c === "auth/user-not-found") return "No account with that username.";
  if(c === "auth/weak-password") return "Password needs at least 6 characters.";
  if(c === "auth/invalid-email") return "That username can't be used — try letters and numbers only.";
  if(c === "auth/operation-not-allowed") return "Email sign-in isn't turned on yet in the Firebase console.";
  if(c === "auth/network-request-failed") return "Network error — check your connection.";
  return "Something went wrong" + (c ? " (" + c + ")" : "") + ". Try again.";
}
$("li-go").onclick = doLogin;
$("li-pw").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
async function doLogin(){
  const name = $("li-name").value.trim().toLowerCase(), pw = $("li-pw").value;
  $("li-err").textContent = "";
  if(!validName(name)){ $("li-err").textContent = "Enter your username."; return; }
  if(!pw){ $("li-err").textContent = "Enter your password."; return; }
  $("li-go").disabled = true;
  try{ await auth.signInWithEmailAndPassword(emailOf(name), pw); }
  catch(e){ $("li-err").textContent = friendlyAuth(e); $("li-go").disabled = false; }
}
$("su-go").onclick = doSignup;
$("su-pw").addEventListener("keydown", e => { if(e.key === "Enter") doSignup(); });
async function doSignup(){
  const name = $("su-name").value.trim(), pw = $("su-pw").value;
  $("su-err").textContent = "";
  if(!validName(name)){ $("su-err").textContent = "Username: 3–20 characters, letters, numbers, _ only."; return; }
  if(pw.length < 6){ $("su-err").textContent = "Password needs at least 6 characters."; return; }
  $("su-go").disabled = true;
  try{
    const lower = name.toLowerCase();
    const taken = await db.ref("prism/usernames/" + lower).once("value");
    if(taken.exists()){ $("su-err").textContent = "That username is taken."; $("su-go").disabled = false; return; }
    const cred = await auth.createUserWithEmailAndPassword(emailOf(lower), pw);
    const uid = cred.user.uid;
    await db.ref("prism/users/" + uid).set({name: name, createdAt: TS});
    await db.ref("prism/usernames/" + lower).set(uid);
  }catch(e){ $("su-err").textContent = friendlyAuth(e); $("su-go").disabled = false; }
}
$("logout").onclick = () => {
  if(me) db.ref("prism/presence/" + me.uid).remove().catch(() => {});
  auth.signOut();
};

auth.onAuthStateChanged(async user => {
  if(user){
    try{
      const banSnap = await db.ref("prism/banned/" + user.uid).once("value");
      if(banSnap.exists()){
        toast("This account has been deleted by an admin.");
        await auth.signOut();
        return;
      }
    }catch(e){}
    try{
      const snap = await db.ref("prism/users/" + user.uid + "/name").once("value");
      me = {uid: user.uid, name: snap.val() || "user"};
    }catch(e){ toast("Couldn't load your profile."); return; }
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    boot();
    if(pendingInvite){
      const code = pendingInvite;
      pendingInvite = null;
      setTimeout(() => handleInvite(code), 800);
    }
  }else{
    me = null;
    unlisten();
    stopAllDMWatchers();
    if(chanListRef){ chanListRef.off(); chanListRef = null; }
    view = {type:"server", sid:null, cid:null};
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
    $("li-go").disabled = false; $("su-go").disabled = false;
  }
});

/* ---------------- boot ---------------- */
async function boot(){
  bootRefs.forEach(r => r.off()); bootRefs = [];
  stopAllDMWatchers();
  $("uname").innerHTML = esc(me.name) + "<small>online</small>";
  renderProfileAvatar($("avatar"), settings.avatar || "", me.name);
  goOnline();
  loadSettings();
  const banRef = db.ref("prism/banned/" + me.uid);
  banRef.on("value", snap => {
    if(snap.exists()){
      toast("Your account was deleted by an admin.");
      auth.signOut();
    }
  });
  bootRefs.push(banRef);
  setInterval(() => { if(me) db.ref("prism/presence/" + me.uid).update({ts: TS}); }, 60000);
  await seedOfficial();
  const sRef = db.ref("prism/servers");
  sRef.on("value", snap => {
    servers = snap.val() || {};
    renderRail();
    if(view.type === "server" && !view.sid) openServer("official");
  });
  bootRefs.push(sRef);
  const msRef = db.ref("prism/myServers/" + me.uid);
  msRef.on("value", snap => {
    myServers = snap.val() || {};
    renderRail();
  });
  bootRefs.push(msRef);
  const pRef = db.ref("prism/presence");
  pRef.on("value", renderMembers);
  bootRefs.push(pRef);
  const dRef = db.ref("prism/userDMs/" + me.uid);
  dRef.on("value", renderDMs);
  bootRefs.push(dRef);
  wireInput();
}
function goOnline(){
  if(!me) return;
  const r = db.ref("prism/presence/" + me.uid);
  r.set({u: me.name, ts: TS, status: settings.status || "", avatar: settings.avatar || ""});
  r.onDisconnect().remove();
}
async function seedOfficial(){
  const ref = db.ref("prism/servers/official");
  const s = await ref.once("value");
  if(s.exists()) return;
  await ref.set({name: "Prism", owner: "system", createdAt: TS});
  await db.ref("prism/serverChannels/official").set({
    general: {name: "general", topic: "Welcome to Prism — everything free, forever."},
    random:  {name: "random",  topic: "Anything goes."},
    gaming:  {name: "gaming",  topic: "What are you playing?"},
    rules:   {name: "rules",   topic: "Be kind. That's the whole rules list."}
  });
  await db.ref("prism/messages/official/general").push(
    {uid: "system", u: "Prism", t: "Welcome to Prism! Create an account, make servers, DM your friends — it's all free.", ts: TS});
}

/* ---------------- servers ---------------- */
function renderRail(){
  const rail = $("rail-servers"); rail.innerHTML = "";
  const ids = Object.keys(servers).filter(sid => sid === "official" || (myServers && myServers[sid]));
  ids.sort((a,b) => (a === "official" ? -1 : b === "official" ? 1 : 0));
  ids.forEach(sid => {
    const s = servers[sid]; if(!s) return;
    const d = document.createElement("div");
    d.className = "srv" + (view.type === "server" && view.sid === sid ? " active" : "");
    d.title = s.name;
    d.innerHTML = "<span class='pill'></span>" + (s.icon ? esc(s.icon) : esc((s.name[0] || "?").toUpperCase()));
    d.onclick = () => openServer(sid);
    rail.appendChild(d);
  });
}
$("srv-add").onclick = () => {
  openModal("Create a server", "Give your server a name. Only people with your invite link can join — including you.",
    "My cool server", "Create", async name => {
      if(!name.trim()) return;
      const ref = db.ref("prism/servers").push();
      const sid = ref.key;
      const code = makeInviteCode();
      try{
        await ref.set({name: name.trim().slice(0, 32), owner: me.uid, createdAt: TS, invite: code});
        await db.ref("prism/invites/" + code).set(sid);
        await db.ref("prism/serverChannels/" + sid + "/general")
          .set({name: "general", topic: "The beginning."});
        const link = inviteLink(code);
        openModal("Server created! 🎉",
          "Here's your invite link. Everyone joins with this link — even you.",
          "", "Copy link", () => copyText(link));
        $("m-input").value = link;
        $("m-input").readOnly = true;
        $("m-input").select();
      }catch(e){ toast("Couldn't create the server."); }
    });
};
function makeInviteCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let s = "";
  for(let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function inviteLink(code){
  return location.origin + location.pathname + "#invite=" + code;
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t)
      .then(() => toast("Invite link copied!"))
      .catch(() => toast("Couldn't copy — long-press the link to copy it."));
  }else toast("Couldn't copy — long-press the link to copy it.");
}
function openServer(sid){
  if(!servers[sid]) return;
  if(sid !== "official" && !(myServers && myServers[sid])){
    toast("You need an invite link to join that server.");
    return;
  }
  if(chanListRef){ chanListRef.off(); chanListRef = null; }
  unlisten();
  view = {type: "server", sid: sid, cid: null};
  $("srv-title").textContent = "◈ " + servers[sid].name;
  $("srv-title").dataset.sid = sid;
  renderRail();
  chanListRef = db.ref("prism/serverChannels/" + sid);
  chanListRef.on("value", snap => {
    const chs = snap.val() || {};
    const box = $("srv-channels"); box.innerHTML = "";
    Object.keys(chs).forEach(cid => {
      const c = chs[cid];
      const ctype = c.type || "chat";
      const d = document.createElement("div");
      d.className = "chan" + (view.cid === cid ? " active" : "");
      d.innerHTML = '<span class="hash">' + (ctype === "forum" ? "📝" : "#") + "</span>" + esc(c.name);
      d.onclick = () => openChannel(sid, cid, c.name, c.topic || "", ctype);
      box.appendChild(d);
    });
    if(view.type === "server" && view.sid === sid && (!view.cid || !chs[view.cid])){
      const first = chs.general ? "general" : Object.keys(chs)[0];
      if(first) openChannel(sid, first, chs[first].name, chs[first].topic || "", chs[first].type || "chat");
    }
  });
}
function openChannel(sid, cid, cname, topic, ctype){
  unlisten();
  view = {type: "server", sid: sid, cid: cid, cname: cname, topic: topic, ctype: ctype || "chat", post: null};
  renderRail();
  document.querySelectorAll("#srv-channels .chan").forEach(el => el.classList.remove("active"));
  $("ch-hash").textContent = (ctype === "forum") ? "📝" : "#";
  $("chname").textContent = cname;
  $("chtopic").textContent = topic;
  $("chdel").classList.toggle("hidden", !isAdmin());
  if((ctype || "chat") === "forum"){
    renderForum();
  }else{
    $("inputbar").style.display = "";
    $("minput").placeholder = "Message #" + cname;
    renderMessages("prism/messages/" + sid + "/" + cid, "s_" + sid + "_" + cid);
  }
}

/* ---------------- channel creation ---------------- */
$("ch-add").onclick = () => {
  const sid = view.type === "server" ? view.sid : $("srv-title").dataset.sid;
  if(!sid || !servers[sid]) return;
  if(servers[sid].owner !== me.uid){ toast("Only the server owner can create channels."); return; }

function confirmDeleteUser(uid, uname){
  if(!isAdmin() || uid === me.uid) return;
  openModal("Delete user",
    "Really delete @" + uname + "? Their account, username, memberships and DMs will be removed and they won't be able to log back in. This can't be undone.",
    "", "Delete", () => deleteUser(uid, uname));

async function deleteUser(uid, uname){
  try{
    await db.ref("prism/banned/" + uid).set({u: uname, ts: Date.now()});
    const updates = {};
    const dmIds = new Set();
    const dmSnap = await db.ref("prism/userDMs").once("value");
    const allDMs = dmSnap.val() || {};
    Object.keys(allDMs).forEach(ouid => {
      const m = allDMs[ouid] || {};
      Object.keys(m).forEach(other => {
        if(other === uid || ouid === uid){
          if(m[other] && m[other].dmId) dmIds.add(m[other].dmId);
          updates["prism/userDMs/" + ouid + "/" + other] = null;
        }
      });
    });
    const readSnap = await db.ref("prism/dmRead").once("value");
    const allRead = readSnap.val() || {};
    Object.keys(allRead).forEach(ouid => {
      const m = allRead[ouid] || {};
      Object.keys(m).forEach(dmId => {
        if(dmIds.has(dmId)) updates["prism/dmRead/" + ouid + "/" + dmId] = null;
      });
    });
    dmIds.forEach(id => { updates["prism/dmMessages/" + id] = null; });
    updates["prism/users/" + uid] = null;
    updates["prism/usernames/" + String(uname).toLowerCase()] = null;
    updates["prism/presence/" + uid] = null;
    updates["prism/myServers/" + uid] = null;
    updates["prism/dmRead/" + uid] = null;
    await db.ref().update(updates);
    toast("User deleted.");
  }catch(e){ toast("Couldn't delete the user."); }
}
function confirmDeleteServer(sid){

async function deleteServer(sid){
  if(sid === "official"){ toast("You can't delete the official server."); return; }
  try{
    const s = servers[sid] || {};
    const updates = {};
    updates["prism/servers/" + sid] = null;
    if(s.invite) updates["prism/invites/" + s.invite] = null;
    updates["prism/serverChannels/" + sid] = null;
    updates["prism/messages/" + sid] = null;
    updates["prism/forum/" + sid] = null;
    updates["prism/forumReplies/" + sid] = null;
    const msnap = await db.ref("prism/myServers").once("value");
    const ms = msnap.val() || {};
    Object.keys(ms).forEach(uid => {
      if(ms[uid] && ms[uid][sid]) updates["prism/myServers/" + uid + "/" + sid] = null;
    });
    for(const p of ["prism/reactions", "prism/pins", "prism/typing"]){
      const psnap = await db.ref(p).once("value").catch(() => null);
      const pv = (psnap && psnap.val()) || {};
      Object.keys(pv).forEach(scope => {
        if(scope.indexOf("s_" + sid + "_") === 0) updates[p + "/" + scope] = null;
      });
    }
    await db.ref().update(updates);
    if(myServers) delete myServers[sid];
    renderRail();
    if(view.sid === sid) openServer("official");
    toast("Server deleted.");
  }catch(e){ toast("Couldn't delete the server."); }
}

/* ---------------- DMs ---------------- */
const dmWatch = {}; // dmId -> watcher {otherUid, name, readTs, ready, lastN, msgs, online, readRef, msgRef, presRef}
function dmReadPath(dmId){ return "prism/dmRead/" + me.uid + "/" + dmId; }
function markDMRead(dmId){
  if(!me || !dmId) return;
  db.ref(dmReadPath(dmId)).set(Date.now()).catch(() => {});
}
function stopDMWatcher(dmId){
  const w = dmWatch[dmId];
  if(!w) return;
  if(w.readRef) w.readRef.off();
  if(w.msgRef) w.msgRef.off();
  if(w.presRef) w.presRef.off();
  delete dmWatch[dmId];
}
function stopAllDMWatchers(){ Object.keys(dmWatch).forEach(stopDMWatcher); }
function watchDM(dmId, otherUid, name){
  if(!me || dmWatch[dmId]) return;
  const w = dmWatch[dmId] = {dmId: dmId, otherUid: otherUid, name: name,
    readTs: 0, ready: false, lastN: 0, msgs: null, online: false};
  w.readRef = db.ref(dmReadPath(dmId));
  w.readRef.on("value", snap => {
    if(!me) return;
    const v = snap.val();
    if(v == null){
      db.ref(dmReadPath(dmId)).set(Date.now()).catch(() => {}); // mark pre-existing history read
      return;
    }
    w.readTs = v; w.ready = true; recountDM(w, false);
  });
  w.msgRef = db.ref("prism/dmMessages/" + dmId).limitToLast(200);
  w.msgRef.on("value", snap => {
    if(!me) return;
    const isNew = w.msgs !== null;
    w.msgs = snap.val() || {};
    recountDM(w, isNew);
  });
  w.presRef = db.ref("prism/presence/" + otherUid);
  w.presRef.on("value", snap => {
    const v = snap.val();
    w.online = !!(v && v.u && (Date.now() - (v.ts || 0) < 120000));
    paintDMOnline(dmId, w.online);
  });
}
function recountDM(w, isNew){
  if(!w.ready || !me) return;
  let n = 0;
  const vals = w.msgs ? Object.values(w.msgs) : [];
  for(let i = 0; i < vals.length; i++){
    const m = vals[i];
    if(m && m.ts > w.readTs && m.uid !== me.uid) n++;
  }
  const viewing = view.type === "dm" && view.dmId === w.dmId;
  if(isNew && n > 0 && w.lastN === 0 && !viewing)
    toast("\uD83D\uDCAC New message from " + w.name);
  w.lastN = n;
  paintDMUnread(w.dmId, n);
}
function paintDMUnread(dmId, n){
  const badge = document.querySelector('#dm-list [data-dm="' + dmId + '"] .badge');
  if(!badge) return;
  badge.textContent = n > 99 ? "99+" : n;
  badge.classList.toggle("hidden", n === 0);
}
function paintDMOnline(dmId, on){
  const dot = document.querySelector('#dm-list [data-dm="' + dmId + '"] .odot');
  if(dot) dot.classList.toggle("on", on);
}
function renderDMs(snap){
  const box = $("dm-list"); box.innerHTML = "";
  const dms = snap.val() || {};
  const seen = {};
  Object.keys(dms).sort((a,b) => (dms[b].lastTs || 0) - (dms[a].lastTs || 0)).forEach(otherUid => {
    const d = dms[otherUid] || {};
    if(!d.dmId) return;
    const dname = d.name || "user";
    seen[d.dmId] = true;
    watchDM(d.dmId, otherUid, dname);
    const el = document.createElement("div");
    el.className = "chan" + (view.type === "dm" && view.otherUid === otherUid ? " active" : "");
    el.setAttribute("data-dm", d.dmId);
    el.dataset.otherUid = otherUid;
    el.innerHTML =
      '<div class="dmav" style="background:' + colorFor(dname) + '">' + esc(dname[0].toUpperCase()) +
      '<span class="odot"></span></div>' +
      '<span class="dname">' + esc(dname) + "</span>" +
      '<span class="badge hidden"></span>' +
      '<span class="dx" title="Close DM">\u00d7</span>';
    renderProfileAvatar(el.querySelector(".dmav"), profileAvatarCache[otherUid] || "", dname);
    if(!Object.prototype.hasOwnProperty.call(profileAvatarCache, otherUid)) loadPublicAvatar(otherUid, el.querySelector(".dmav"), dname);
    el.onclick = () => openDM(otherUid, dname, d.dmId);
    el.querySelector(".dx").onclick = e => { e.stopPropagation(); closeDM(otherUid, d.dmId); };
    box.appendChild(el);
  });
  Object.keys(dmWatch).forEach(id => { if(!seen[id]) stopDMWatcher(id); });
  Object.values(dmWatch).forEach(w => {
    paintDMUnread(w.dmId, w.lastN);
    paintDMOnline(w.dmId, w.online);
  });
}
function closeDM(otherUid, dmId){
  stopDMWatcher(dmId);
  if(me){
    db.ref("prism/userDMs/" + me.uid + "/" + otherUid).remove().catch(() => {});
    db.ref(dmReadPath(dmId)).remove().catch(() => {});
  }
  if(view.type === "dm" && view.dmId === dmId){
    const first = servers.official ? "official" : Object.keys(servers)[0];
    if(first) openServer(first);
  }
}

function openDM(otherUid, otherName, dmId){
  if(chanListRef){ chanListRef.off(); chanListRef = null; }

function renderMessages(path, typeScope){
  $("msgs").innerHTML = ""; $("typing").textContent = "";

  clearReply();

  const mRef = db.ref(path).limitToLast(100);
  let lastDay = "";
  listen(mRef, "child_added", snap => {

    const d = new Date(m.ts || Date.now());

function normalizeMessageGroups(){
  const container = $("msgs");
  if(!container) return;
  let previous = null;
  for(const node of container.children){
    if(node.classList.contains("daydiv")){
      previous = null;
      continue;
    }
    if(!node.classList.contains("msg")) continue;
    node.classList.remove("msg-grouped");
    const sameAuthor = previous &&
      node.dataset.author &&
      node.dataset.author === previous.dataset.author &&
      node.dataset.authorLabel === previous.dataset.authorLabel;
    const elapsed = sameAuthor
      ? Number(node.dataset.timestamp) - Number(previous.dataset.timestamp)
      : Infinity;
    if(sameAuthor && elapsed >= 0 && elapsed <= 5 * 60 * 1000 && node.dataset.hasReply !== "1"){
      node.classList.add("msg-grouped");
    }
    previous = node;
  }
}

function jumpToMsg(key){

let inputWired = false;
function wireInput(){
  if(inputWired) return; inputWired = true;
  const minput = $("minput");
  let typeTimer = null;
  minput.addEventListener("input", () => {
    const scope = view.type === "server" ? "s_" + view.sid + "_" + view.cid : "d_" + view.dmId;
    if(view.cid || view.dmId){
      db.ref("prism/typing/" + scope + "/" + me.uid).set(me.name).catch(() => {});

    }
    minput.style.height = "auto";
    minput.style.height = Math.min(minput.scrollHeight, 120) + "px";

function send(){
  const t = $("minput").value.trim();
  if(!t || !me) return;
  const msg = {uid: me.uid, u: me.name, t: t.slice(0, 2000), ts: TS};
  if(replyTo) msg.reply = replyTo;
  if(view.type === "server" && view.cid){
    if(view.ctype === "forum"){
      if(!view.post) return;
      const pid = view.post;
      db.ref("prism/forumReplies/" + view.sid + "/" + view.cid + "/" + pid).push(msg)
        .catch(() => toast("Couldn't send — check your connection."));
      db.ref("prism/forum/" + view.sid + "/" + view.cid + "/" + pid + "/replyCount")
        .transaction(c => (c || 0) + 1).catch(() => {});
    }else{
      const scope = "s_" + view.sid + "_" + view.cid;
      db.ref("prism/messages/" + view.sid + "/" + view.cid).push(msg)
        .catch(() => toast("Couldn't send — check your connection."));
      db.ref("prism/typing/" + scope + "/" + me.uid).remove().catch(() => {});
    }
  }else if(view.type === "dm"){
    db.ref("prism/dmMessages/" + view.dmId).push(msg)
      .catch(() => toast("Couldn't send — check your connection."));
    db.ref("prism/typing/d_" + view.dmId + "/" + me.uid).remove().catch(() => {});
    const now = Date.now();
    db.ref("prism/userDMs/" + me.uid + "/" + view.otherUid + "/lastTs").set(now).catch(() => {});
    db.ref("prism/userDMs/" + view.otherUid + "/" + me.uid + "/lastTs").set(now).catch(() => {});
  }else return;
  $("minput").value = ""; $("minput").style.height = "auto";
  clearReply();
}

$("set-avatar-upload").onclick = () => $("set-avatar-file").click();
$("set-avatar-file").onchange = async () => {
  const file = $("set-avatar-file").files && $("set-avatar-file").files[0];
  if(!file) return;
  if(!/^image\/(?:png|jpeg|webp)$/i.test(file.type)){
    toast("Choose a PNG, JPG, or WebP image.");
    $("set-avatar-file").value = "";
    return;
  }
  if(file.size > 5 * 1024 * 1024){
    toast("Choose an image smaller than 5 MB.");
    $("set-avatar-file").value = "";
    return;
  }
  try{
    const avatar = await resizeAvatarFile(file);
    if(!isSafeAvatarSource(avatar)) throw new Error("Image is too large after resizing.");
    draftAvatar = avatar;
    $("set-avatar-url").value = "";
    refreshAvatarPreview();
    toast("Profile icon ready. Press Save to apply it.");
  }catch(e){
    toast(e && e.message || "Couldn't process that image.");
  }finally{
    $("set-avatar-file").value = "";
  }
};
function resizeAvatarFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Couldn't read that image."));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error("That image file can't be opened."));
      image.onload = () => {
        const canvas = document.createElement("canvas");
        const size = 256;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        if(!ctx) return reject(new Error("Image processing isn't available."));
        ctx.fillStyle = "#252833"; ctx.fillRect(0, 0, size, size);
        const w = image.naturalWidth || image.width;
        const h = image.naturalHeight || image.height;
        const side = Math.min(w, h);
        ctx.drawImage(image, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
        let result = canvas.toDataURL("image/jpeg", 0.82);
        if(result.length > 200000) result = canvas.toDataURL("image/jpeg", 0.65);
        if(result.length > 260000) return reject(new Error("That image couldn't be compressed enough."));
        resolve(result);
      };
      image.src = String(reader.result || "");
    };
    reader.readAsDataURL(file);
  });
}

  $("m-input").placeholder = placeholder;
  $("m-ok").textContent = okLabel;
  modalCb = cb;
  $("modal").classList.remove("hidden");
  setTimeout(() => $("m-input").focus(), 50);
}
function closeModal(){ $("modal").classList.add("hidden"); modalCb = null; }
$("m-cancel").onclick = closeModal;
$("pinbtn").onclick = openPins;
$("pins-close").onclick = closePins;
$("reply-x").onclick = clearReply;
$("srv-title").parentElement.style.cursor = "pointer";
$("srv-title").parentElement.onclick = toggleSrvMenu;
pendingInvite = parseInviteHash();
window.addEventListener("hashchange", () => {
  const code = parseInviteHash();
  if(code && me) handleInvite(code);
  else if(code) pendingInvite = code;
});
$("m-ok").onclick = () => { const v = $("m-input").value; const cb = modalCb; closeModal(); if(cb) cb(v); };
$("m-input").addEventListener("keydown", e => {
  if(e.key === "Enter"){ const v = $("m-input").value; const cb = modalCb; closeModal(); if(cb) cb(v); }
  if(e.key === "Escape") closeModal();
});
</script>
<script src="./public/voice-chat.js"></script>
</body>
